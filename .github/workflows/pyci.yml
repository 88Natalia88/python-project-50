name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Официальный экшен для быстрой установки uv и Python
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12" # Указываем ту же версию, что и в pyproject.toml

      - name: Install dependencies
        run: make install

      - name: Run linter
        run: make lint

      - name: Run test coverage
        run: make test-coverage
