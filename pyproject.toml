[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "C90", "UP", "B", "S", "FURB", "RUF"]

[tool.ruff.lint.per-file-ignores]
# В init-модулях допустимы неиспользуемые импорты
"__init__.py" = ["unused-import"]
# assert в тестах это норма pytest
"tests/**" = ["assert"]

[tool.coverage.report]
fail_under = 90

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing"
